name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run cargo publish with --dry-run
        required: true
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  CRATES: rusuna rusuna-sqlx rusuna-async-graphql rusuna-axum

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches Cargo.toml version
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "rusuna") | .version')
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}" >&2
            exit 1
          fi
      - name: Dry run
        run: cargo publish --workspace --dry-run
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        if: github.event_name == 'push' || !inputs.dry_run
        id: auth
      - name: Publish
        if: github.event_name == 'push' || !inputs.dry_run
        run: |
          VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "rusuna") | .version')
          for crate in $CRATES; do
            if curl -sf -A rusuna-publish/1 "https://crates.io/api/v1/crates/${crate}/${VERSION}" > /dev/null; then
              echo "${crate} ${VERSION} is already published"
            else
              cargo publish -p "${crate}"
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
