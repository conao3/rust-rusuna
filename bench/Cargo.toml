[workspace]

[package]
name = "rusuna-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rusuna = { path = ".." }
viat-gql = "1.0.2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
anyhow = "1"
