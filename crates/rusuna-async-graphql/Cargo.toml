[package]
name = "rusuna-async-graphql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Serve a rusuna schema from an async-graphql dynamic schema beside hand-written resolvers"
keywords = ["graphql", "postgresql", "hasura", "async-graphql"]
categories = ["database", "web-programming"]

[dependencies]
async-graphql = { workspace = true }
async-graphql-value = "7.2.1"
async-trait = "0.1"
chrono = { workspace = true }
futures-util = { version = "0.3", default-features = false }
httpdate = "1.0"
percent-encoding = "2.3"
rusuna = { workspace = true }
rusuna-http-client = { workspace = true }
rusuna-sqlx = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["time"] }
url = "2.5"
