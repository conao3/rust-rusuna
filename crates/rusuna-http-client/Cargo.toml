[package]
name = "rusuna-http-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "The hyper and rustls HTTP client that rusuna uses for webhooks and remote schemas"
keywords = ["http", "client", "hyper", "rustls", "rusuna"]
categories = ["web-programming::http-client"]

[dependencies]
bytes = "1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "tls12", "ring", "webpki-roots"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
