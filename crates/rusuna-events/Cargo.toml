[package]
name = "rusuna-events"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Event triggers and cron triggers on PostgreSQL for rusuna, delivered to Rust handlers and webhooks"
keywords = ["postgresql", "hasura", "events", "cron", "webhook"]
categories = ["database", "web-programming"]

[dependencies]
bytes = "1"
chrono = { workspace = true, features = ["clock"] }
croner = { version = "4.0.3", default-features = false, features = ["chrono"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "tls12", "ring", "webpki-roots"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
axum = { workspace = true }
rusuna = { workspace = true }
rusuna-sqlx = { workspace = true }
