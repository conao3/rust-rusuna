[package]
name = "rusuna-events"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Event triggers and cron triggers on PostgreSQL for rusuna, delivered to Rust handlers and webhooks"
keywords = ["postgresql", "hasura", "events", "cron", "webhook"]
categories = ["database", "web-programming"]

[dependencies]
chrono = { workspace = true, features = ["clock"] }
croner = { version = "5.0.0", default-features = false, features = ["chrono"] }
rusuna-http-client = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
axum = { workspace = true }
rusuna = { workspace = true }
rusuna-sqlx = { workspace = true }
