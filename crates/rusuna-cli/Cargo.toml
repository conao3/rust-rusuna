[package]
name = "rusuna-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Expand a rusuna schema and compile GraphQL queries to PostgreSQL"
repository = "https://github.com/conao3/rust-rusuna"
publish = false

[[bin]]
name = "rusuna"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusuna = { path = "../.." }
serde_json = "1"
