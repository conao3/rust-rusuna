[package]
name = "rusuna-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Expand a rusuna schema and compile GraphQL queries to PostgreSQL"
keywords = ["graphql", "postgresql", "hasura", "cli"]
categories = ["command-line-utilities", "database"]
publish = false

[[bin]]
name = "rusuna"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusuna = { workspace = true }
serde_json = { workspace = true }
