scalar DateTime

type author @table(name: "author") @primary_key(columns: ["id"])
  @permission(role: "limited", columns: ["id", "name"], where: {}, allow_aggregations: true, limit: 2)
  @permission(role: "zero", columns: ["id", "name"], where: {}, allow_aggregations: true, limit: 0) {
  id: Int!
  name: String!
  nickname: String
  rating: Float
  articles: [article!]! @relation(columns: ["id"], references: ["author_id"])
  articles_aggregate: article_aggregate! @aggregate(target: "article") @relation(columns: ["id"], references: ["author_id"])
}

type article @table(name: "article") @primary_key(columns: ["id"])
  @permission(role: "limited", columns: ["id", "author_id", "title"], where: {id: {_gte: 2}}, allow_aggregations: true, limit: 3)
  @permission(role: "zero", columns: ["id", "author_id", "title"], where: {}, allow_aggregations: true, limit: 0) {
  id: Int!
  author_id: Int!
  title: String!
  published_at: DateTime!
  author: author! @relation(columns: ["author_id"], references: ["id"])
  comments: [comment!]! @relation(columns: ["id"], references: ["article_id"])
  comments_aggregate: comment_aggregate! @aggregate(target: "comment") @relation(columns: ["id"], references: ["article_id"])
  revisions: [revision!]! @relation(columns: ["id", "author_id"], references: ["article_id", "author_id"])
}

type comment @table(name: "comment") @primary_key(columns: ["id"])
  @permission(role: "limited", columns: ["id", "article_id", "body"], where: {}, allow_aggregations: true, limit: 2)
  @permission(role: "zero", columns: ["id", "article_id", "body"], where: {})
  @insert_permission(role: "limited", columns: ["id", "article_id", "body"], check: {})
  @delete_permission(role: "limited", where: {}) {
  id: Int!
  article_id: Int!
  body: String!
  article: article! @relation(columns: ["article_id"], references: ["id"])
}

type revision @table(name: "revision") @primary_key(columns: ["article_id", "author_id", "note"])
  @permission(role: "limited", columns: ["article_id", "author_id", "note"], where: {}, allow_aggregations: true) {
  article_id: Int!
  author_id: Int!
  note: String!
  article: article! @relation(columns: ["article_id", "author_id"], references: ["id", "author_id"])
}

type Query {
  author: [author!]! @list
  author_aggregate: author_aggregate! @aggregate(target: "author")
  article: [article!]! @list
  article_aggregate: article_aggregate! @aggregate(target: "article")
  comment: [comment!]! @list
  comment_aggregate: comment_aggregate! @aggregate(target: "comment")
  revision: [revision!]! @list
}
