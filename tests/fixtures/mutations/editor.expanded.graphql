schema { query: Query mutation: Mutation subscription: Subscription }

input Int_comparison_exp {
  _eq: Int
  _neq: Int
  _gt: Int
  _gte: Int
  _lt: Int
  _lte: Int
  _in: [Int!]
  _nin: [Int!]
  _is_null: Boolean
}

type Mutation {
  insert_mutation_item(objects: [mutation_item_insert_input!]!, on_conflict: mutation_item_on_conflict): mutation_item_mutation_response
  insert_mutation_item_one(object: mutation_item_insert_input!, on_conflict: mutation_item_on_conflict): mutation_item
  update_mutation_item(where: mutation_item_bool_exp!, _set: mutation_item_set_input, _inc: mutation_item_inc_input): mutation_item_mutation_response
  delete_mutation_item(where: mutation_item_bool_exp!): mutation_item_mutation_response
  update_mutation_item_by_pk(pk_columns: mutation_item_pk_columns_input!, _set: mutation_item_set_input, _inc: mutation_item_inc_input): mutation_item
  delete_mutation_item_by_pk(id: Int!): mutation_item
}

type Query {
  mutation_author(where: mutation_author_bool_exp, order_by: [mutation_author_order_by!], limit: Int, offset: Int): [mutation_author!]!
  mutation_item(where: mutation_item_bool_exp, order_by: [mutation_item_order_by!], limit: Int, offset: Int): [mutation_item!]!
  mutation_author_by_pk(id: Int!): mutation_author
  mutation_item_by_pk(id: Int!): mutation_item
}

input String_comparison_exp {
  _eq: String
  _neq: String
  _gt: String
  _gte: String
  _lt: String
  _lte: String
  _in: [String!]
  _nin: [String!]
  _is_null: Boolean
  _like: String
  _nlike: String
  _ilike: String
  _nilike: String
}

type Subscription {
  mutation_author(where: mutation_author_bool_exp, order_by: [mutation_author_order_by!], limit: Int, offset: Int): [mutation_author!]!
  mutation_item(where: mutation_item_bool_exp, order_by: [mutation_item_order_by!], limit: Int, offset: Int): [mutation_item!]!
  mutation_author_by_pk(id: Int!): mutation_author
  mutation_item_by_pk(id: Int!): mutation_item
}

type mutation_author {
  id: Int!
  name: String!
  items(where: mutation_item_bool_exp, order_by: [mutation_item_order_by!], limit: Int, offset: Int): [mutation_item!]!
  items_aggregate(where: mutation_item_bool_exp, order_by: [mutation_item_order_by!], limit: Int, offset: Int): mutation_item_aggregate!
}

input mutation_author_bool_exp {
  _and: [mutation_author_bool_exp!]
  _or: [mutation_author_bool_exp!]
  _not: mutation_author_bool_exp
  id: Int_comparison_exp
  name: String_comparison_exp
  items: mutation_item_bool_exp
}

input mutation_author_order_by {
  id: order_by
  name: order_by
}

type mutation_item {
  id: Int!
  owner_id: Int!
  title: String!
  score: Int!
  note: String
  owner: mutation_author
}

type mutation_item_aggregate {
  aggregate: mutation_item_aggregate_fields
  nodes: [mutation_item!]!
}

type mutation_item_aggregate_fields {
  count: Int!
  sum: mutation_item_sum_fields
  avg: mutation_item_avg_fields
  min: mutation_item_min_fields
  max: mutation_item_max_fields
}

type mutation_item_avg_fields {
  id: Float
  owner_id: Float
  score: Float
}

input mutation_item_bool_exp {
  _and: [mutation_item_bool_exp!]
  _or: [mutation_item_bool_exp!]
  _not: mutation_item_bool_exp
  id: Int_comparison_exp
  owner_id: Int_comparison_exp
  title: String_comparison_exp
  score: Int_comparison_exp
  note: String_comparison_exp
  owner: mutation_author_bool_exp
}

enum mutation_item_constraint { mutation_item_pkey }

input mutation_item_inc_input {
  score: Int
}

input mutation_item_insert_input {
  id: Int
  title: String
  score: Int
  note: String
}

type mutation_item_max_fields {
  id: Int
  owner_id: Int
  title: String
  score: Int
  note: String
}

type mutation_item_min_fields {
  id: Int
  owner_id: Int
  title: String
  score: Int
  note: String
}

type mutation_item_mutation_response {
  affected_rows: Int!
  returning: [mutation_item!]!
}

input mutation_item_on_conflict {
  constraint: mutation_item_constraint!
  update_columns: [mutation_item_update_column!]!
  where: mutation_item_bool_exp
}

input mutation_item_order_by {
  id: order_by
  owner_id: order_by
  title: order_by
  score: order_by
  note: order_by
}

input mutation_item_pk_columns_input {
  id: Int!
}

input mutation_item_set_input {
  title: String
  score: Int
}

type mutation_item_sum_fields {
  id: Int
  owner_id: Int
  score: Int
}

enum mutation_item_update_column { title score }

enum order_by { asc asc_nulls_first asc_nulls_last desc desc_nulls_first desc_nulls_last }
