schema { query: Query mutation: Mutation }

input Boolean_comparison_exp {
  _eq: Boolean
  _neq: Boolean
  _gt: Boolean
  _gte: Boolean
  _lt: Boolean
  _lte: Boolean
  _in: [Boolean!]
  _nin: [Boolean!]
  _is_null: Boolean
}

scalar DateTime

input DateTime_comparison_exp {
  _eq: DateTime
  _neq: DateTime
  _gt: DateTime
  _gte: DateTime
  _lt: DateTime
  _lte: DateTime
  _in: [DateTime!]
  _nin: [DateTime!]
  _is_null: Boolean
}

input Float_comparison_exp {
  _eq: Float
  _neq: Float
  _gt: Float
  _gte: Float
  _lt: Float
  _lte: Float
  _in: [Float!]
  _nin: [Float!]
  _is_null: Boolean
}

input ID_comparison_exp {
  _eq: ID
  _neq: ID
  _gt: ID
  _gte: ID
  _lt: ID
  _lte: ID
  _in: [ID!]
  _nin: [ID!]
  _is_null: Boolean
}

input Int_comparison_exp {
  _eq: Int
  _neq: Int
  _gt: Int
  _gte: Int
  _lt: Int
  _lte: Int
  _in: [Int!]
  _nin: [Int!]
  _is_null: Boolean
}

type Mutation {
  insert_article(objects: [article_insert_input!]!, on_conflict: article_on_conflict): article_mutation_response
  insert_article_one(object: article_insert_input!, on_conflict: article_on_conflict): article
  update_article(where: article_bool_exp!, _set: article_set_input, _inc: article_inc_input): article_mutation_response
  delete_article(where: article_bool_exp!): article_mutation_response
  update_article_by_pk(pk_columns: article_pk_columns_input!, _set: article_set_input, _inc: article_inc_input): article
  delete_article_by_pk(id: Int!): article
  insert_author(objects: [author_insert_input!]!, on_conflict: author_on_conflict): author_mutation_response
  insert_author_one(object: author_insert_input!, on_conflict: author_on_conflict): author
  update_author(where: author_bool_exp!, _set: author_set_input, _inc: author_inc_input): author_mutation_response
  delete_author(where: author_bool_exp!): author_mutation_response
  update_author_by_pk(pk_columns: author_pk_columns_input!, _set: author_set_input, _inc: author_inc_input): author
  delete_author_by_pk(id: Int!): author
  insert_comment(objects: [comment_insert_input!]!, on_conflict: comment_on_conflict): comment_mutation_response
  insert_comment_one(object: comment_insert_input!, on_conflict: comment_on_conflict): comment
  update_comment(where: comment_bool_exp!, _set: comment_set_input, _inc: comment_inc_input): comment_mutation_response
  delete_comment(where: comment_bool_exp!): comment_mutation_response
  update_comment_by_pk(pk_columns: comment_pk_columns_input!, _set: comment_set_input, _inc: comment_inc_input): comment
  delete_comment_by_pk(id: Int!): comment
  insert_revision(objects: [revision_insert_input!]!, on_conflict: revision_on_conflict): revision_mutation_response
  insert_revision_one(object: revision_insert_input!, on_conflict: revision_on_conflict): revision
  update_revision(where: revision_bool_exp!, _set: revision_set_input, _inc: revision_inc_input): revision_mutation_response
  delete_revision(where: revision_bool_exp!): revision_mutation_response
  update_revision_by_pk(pk_columns: revision_pk_columns_input!, _set: revision_set_input, _inc: revision_inc_input): revision
  delete_revision_by_pk(article_id: Int!, author_id: Int!, note: String!): revision
}

type Query {
  author(where: author_bool_exp, order_by: [author_order_by!], limit: Int, offset: Int): [author!]!
  author_aggregate(where: author_bool_exp, order_by: [author_order_by!], limit: Int, offset: Int): author_aggregate!
  article(where: article_bool_exp, order_by: [article_order_by!], limit: Int, offset: Int): [article!]!
  article_aggregate(where: article_bool_exp, order_by: [article_order_by!], limit: Int, offset: Int): article_aggregate!
  comment(where: comment_bool_exp, order_by: [comment_order_by!], limit: Int, offset: Int): [comment!]!
  comment_aggregate(where: comment_bool_exp, order_by: [comment_order_by!], limit: Int, offset: Int): comment_aggregate!
  revision(where: revision_bool_exp, order_by: [revision_order_by!], limit: Int, offset: Int): [revision!]!
  revision_aggregate(where: revision_bool_exp, order_by: [revision_order_by!], limit: Int, offset: Int): revision_aggregate!
  people(where: author_bool_exp, order_by: [author_order_by!], limit: Int, offset: Int): [author!]!
  people_stats(where: author_bool_exp, order_by: [author_order_by!], limit: Int, offset: Int): author_aggregate!
  article_by_pk(id: Int!): article
  author_by_pk(id: Int!): author
  comment_by_pk(id: Int!): comment
  revision_by_pk(article_id: Int!, author_id: Int!, note: String!): revision
}

input String_comparison_exp {
  _eq: String
  _neq: String
  _gt: String
  _gte: String
  _lt: String
  _lte: String
  _in: [String!]
  _nin: [String!]
  _is_null: Boolean
  _like: String
  _nlike: String
  _ilike: String
  _nilike: String
}

type article {
  id: Int!
  author_id: Int!
  title: String!
  published_at: DateTime!
  author: author!
  comments(where: comment_bool_exp, order_by: [comment_order_by!], limit: Int, offset: Int): [comment!]!
  comments_aggregate(where: comment_bool_exp, order_by: [comment_order_by!], limit: Int, offset: Int): comment_aggregate!
  revisions(where: revision_bool_exp, order_by: [revision_order_by!], limit: Int, offset: Int): [revision!]!
  revisions_aggregate(where: revision_bool_exp, order_by: [revision_order_by!], limit: Int, offset: Int): revision_aggregate!
}

type article_aggregate {
  aggregate: article_aggregate_fields
  nodes: [article!]!
}

type article_aggregate_fields {
  count: Int!
  sum: article_sum_fields
  avg: article_avg_fields
  min: article_min_fields
  max: article_max_fields
}

type article_avg_fields {
  id: Float
  author_id: Float
}

input article_bool_exp {
  _and: [article_bool_exp!]
  _or: [article_bool_exp!]
  _not: article_bool_exp
  id: Int_comparison_exp
  author_id: Int_comparison_exp
  title: String_comparison_exp
  published_at: DateTime_comparison_exp
  author: author_bool_exp
  comments: comment_bool_exp
  revisions: revision_bool_exp
}

enum article_constraint { article_pkey }

input article_inc_input {
  id: Int
  author_id: Int
}

input article_insert_input {
  id: Int
  author_id: Int
  title: String
  published_at: DateTime
}

type article_max_fields {
  id: Int
  author_id: Int
  title: String
  published_at: DateTime
}

type article_min_fields {
  id: Int
  author_id: Int
  title: String
  published_at: DateTime
}

type article_mutation_response {
  affected_rows: Int!
  returning: [article!]!
}

input article_on_conflict { constraint: article_constraint! update_columns: [article_update_column!]! where: article_bool_exp }

input article_order_by {
  id: order_by
  author_id: order_by
  title: order_by
  published_at: order_by
}

input article_pk_columns_input { id: Int! }

input article_set_input {
  id: Int
  author_id: Int
  title: String
  published_at: DateTime
}

type article_sum_fields {
  id: Int
  author_id: Int
}

enum article_update_column { id author_id title published_at }

type author {
  id: Int!
  name: String!
  nickname: String
  rating: Float
  articles(where: article_bool_exp, order_by: [article_order_by!], limit: Int, offset: Int): [article!]!
