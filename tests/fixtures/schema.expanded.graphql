input author_order_by {
  id: order_by
  name: order_by
  nickname: order_by
  rating: order_by
}

input author_pk_columns_input { id: Int! }

input author_set_input {
  id: Int
  name: String
  nickname: String
  rating: Float
}

type author_sum_fields {
  id: Int
